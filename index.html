<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2300e8e8'/%3E%3Cpath d='M50 30 88 52v60H12V52Z' fill='%23fff' stroke='%23000' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M50 48 43 57M63 55l-6 9M29 66l-1 8' stroke='%23000' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suspeitos</title>
<!-- trava do site principal (Firebase único + liberação pela Central). Sem ela, roda em modo local. -->
<script src="/trava.js" data-site="suspeitos"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css?v=202610081405">
</head>
<body>
<div id="palco" class="luz-normal">
  <div id="fundo"></div>
  <div id="objetos"></div>
  <div id="personagens"></div>
  <div id="luz"></div>
  <div id="vulto-camada"></div>
  <div id="espiar"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
  <div id="alvos"></div>
  <div id="bustos"></div>
  <div id="examinar"><img alt=""></div>

  <!-- HUD (fica embaixo/centro: os cantos de cima são da facecam) -->
  <div id="hud">
    <div id="nomeSala"></div>
    <div id="toasts"></div>
    <div id="escolhas"></div>
    <div id="dlg" class="oculto">
      <div class="retrato"></div>
      <div class="placa"></div>
      <div class="texto"></div>
      <div class="seta">▼</div>
      <button class="voltar oculto" title="Voltar uma fala (← ou Backspace)">↶ voltar</button>
    </div>
    <div id="menu" class="oculto"></div>
    <button id="btnPistas" class="oculto" title="Pistas (P)"><span class="ic">🗂</span><span class="n">0</span></button>
    <div id="assistindo" class="oculto"></div>
    <div id="dica" class="oculto"></div>
  </div>

  <div id="painel" class="oculto"></div>
  <div id="deducao" class="oculto"></div>
  <div id="relogio" class="oculto"><div class="hora"></div><div class="txt"></div><div class="dica">clique para continuar</div></div>
  <div id="titulo" class="oculto"><div class="t"></div><div class="s"></div></div>
  <div id="novaPista" class="oculto"></div>
  <div id="foto" class="oculto"></div>
  <div id="fotosRest" class="oculto"></div>
  <div id="transicao"><div class="txt"></div></div>
  <div id="flash"></div>
  <div id="relampago"></div>
  <div id="cursores"></div>
  <div id="lobby" class="oculto"></div>
  <div id="fimTela" class="oculto"></div>
  <!-- som: fica acima de tudo (inclusive do lobby), canto de baixo à esquerda -->
  <button id="btnSom" title="Som">🔊</button>
  <div id="painelSom" class="oculto">
    <div class="linha"><span>Música</span><input type="range" min="0" max="100" data-canal="musica"><b></b></div>
    <div class="linha"><span>Efeitos sonoros (inclui a chuva)</span><input type="range" min="0" max="100" data-canal="efeitos"><b></b></div>
    <button class="mudo">Silenciar tudo (M)</button>
  </div>
  <div id="carregando">carregando...</div>
</div>

<script src="js/config.js?v=202610081405"></script>
<script src="js/dados/personagens.js?v=202610081405"></script>
<script src="js/dados/pistas.js?v=202610081405"></script>
<script src="js/dados/cenarios.js?v=202610081405"></script>
<script src="js/dados/roteiro.js?v=202610081405"></script>
<script src="js/dados/isca.js?v=202610081405"></script>
<script src="js/dados/tutorial.js?v=202610081405"></script>
<script src="js/placeholders.js?v=202610081405"></script>
<script src="js/audio.js?v=202610081405"></script>
<script src="js/motor.js?v=202610081405"></script>
<script src="js/rede.js?v=202610081405"></script>
<script src="js/ui.js?v=202610081405"></script>
<script src="js/chuva.js?v=202610081405"></script>
<script src="js/main.js?v=202610081405"></script>
</body>
</html>
